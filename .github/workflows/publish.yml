name: Publish approved npm release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type publish followed by a space and the exact version (e.g. publish 0.1.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify explicit release confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node -e 'const p=require("./package.json"); if(process.env.CONFIRMATION!==`publish ${p.version}`) process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run test:package
      - run: npm publish --access public --provenance
